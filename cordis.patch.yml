# dsh-token-cost-estimate bundle layer.
#
# One host row. It folds the durable Session event feed, estimates every
# Assistant settlement from the local pi-ai catalogs, and publishes the running
# total as a Session projection its own browser half reads. Nothing is polled:
# the framework pushes a new value only when a settlement changes it.
- insert:
    - id: token-cost-estimate
      name: 'dsh-token-cost-estimate'
